<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Dashboard</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mut:#86868b;--line:#e8e8ed;--soft:#f5f5f7;--blue:#0071e3;--green:#34c759;--orange:#ff9f0a;--red:#ff3b30;--seg:#e3e3e8}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#98989d;--line:#2c2c2e;--soft:#2c2c2e;--blue:#0a84ff;--seg:#1c1c1e}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Segoe UI,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:auto;padding:0 20px 80px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.hd{max-width:1180px;margin:auto;padding:18px 20px 12px}
h1{font:700 34px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.fresh{font-size:13px;color:var(--mut);margin-top:4px}
.seg{display:inline-flex;gap:2px;background:var(--seg);border-radius:10px;padding:2px;margin-top:12px;max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
h2{font:700 22px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.01em;margin:34px 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .up{font-size:13px;font-weight:400;color:var(--mut);letter-spacing:0}
.lead{color:var(--mut);font-size:14px;margin:0 0 14px}
.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);min-width:0}
@media(prefers-color-scheme:dark){.card{box-shadow:none}}
.lab{font-size:13px;color:var(--mut);font-weight:500}
.val{font:600 32px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--mut)}
.ct{font-weight:600;font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.ct span{font-weight:400;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 0;border-top:1px solid var(--line);vertical-align:top;text-align:left}th{font-size:12px;color:var(--mut);font-weight:500;border-top:0;padding-top:0}
tr:first-child td{border-top:0}td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}td.m{color:var(--mut)}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:#248a3d}.pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent);color:#c93400}.pill.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:#d70015}
@media(prefers-color-scheme:dark){.pill.ok{color:#30d158}.pill.warn{color:#ffb340}.pill.bad{color:#ff6961}}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.note{background:var(--card);border-radius:14px;padding:12px 16px;font-size:14px;margin-top:14px;border-left:3px solid var(--orange)}
.chart{height:140px}.chart svg{width:100%;height:100%;display:block}.spark{height:30px;margin-top:8px}.spark svg{width:100%;height:100%;display:block}
.tip{position:relative;cursor:default}.tip .pop{display:none;position:absolute;left:0;top:100%;z-index:9;margin-top:8px;width:300px;max-width:84vw;background:rgba(29,29,31,.96);color:#f5f5f7;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.55;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.tip:hover .pop,.tip:focus .pop{display:block}.pop .ok{color:#30d158}.pop .no{color:#ff6961}.pop .nx{color:#ffd60a}
.biz{margin-bottom:14px}.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.n{background:var(--soft);border-radius:12px;padding:10px 12px}.n .v{font:600 22px -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;letter-spacing:-.01em}.n .l{font-size:12px;color:var(--mut)}.n .s{font-size:11px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
@media(max-width:560px){h1{font-size:28px}.val{font-size:28px}.c2{grid-template-columns:1fr}}
.watch{display:inline-block;padding:4px 10px;border-radius:980px;background:var(--blue,#0071e3);color:#fff!important;text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap}
</style></head><body>
<header><div class="hd"><h1>Dashboard</h1><div class="fresh" id="fresh">Loading…</div><div class="seg" id="nav"></div></div></header>
<div class="wrap" id="app"></div>
<script>
const SB='https://yhsxxblilclylzgejehk.supabase.co/rest/v1/rpc/dash_stats',KEY='sb_publishable_9BiONVmj8Ht4k7lBsxGkkA_Yajbl8Rj';
const $=s=>document.querySelector(s);
const fmt=n=>n==null||n===''?'–':typeof n==='string'?n:Math.abs(n)>=1e4?(n/1e3).toFixed(n>=1e5?0:1)+'k':Number(n).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{if(!t)return 'never';const m=(Date.now()-new Date(t))/6e4;return m<1?'just now':m<60?Math.round(m)+' min ago':m<2880?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
const clock=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET';
const dayName=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const days=n=>[...Array(n)].map((_,i)=>new Date(Date.now()-(n-1-i)*864e5).toLocaleDateString('en-CA',{timeZone:'America/New_York'}));
const series=(o,n)=>days(n).map(d=>(o||{})[d]||0),sum=a=>a.reduce((x,y)=>x+y,0);
function line(v,h=40,color='var(--blue)'){const m=Math.max(1,...v),st=100/Math.max(1,v.length-1),pts=v.map((n,i)=>[i*st,h-2-n/m*(h-6)]),l=pts.map(p=>p.join(',')).join(' '),id='g'+Math.random().toString(36).slice(2,7);
 return `<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${l} 100,${h}" fill="url(#${id})"/><polyline points="${l}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function bars(v,labels){const m=Math.max(1,...v),w=100/v.length;return `<svg viewBox="0 0 100 40" preserveAspectRatio="none">${v.map((n,i)=>`<rect x="${i*w+.4}" width="${w-.8}" y="${40-n/m*38}" height="${n/m*38}" rx=".6" fill="var(--blue)" opacity="${n?1:.15}"><title>${labels?labels[i]+': ':''}${n}</title></rect>`).join('')}</svg>`}
const kpi=(l,v,sub,sp)=>`<div class="card"><div class="lab">${l}</div><div class="val">${fmt(v)}</div><div class="sub">${sub||''}</div>${sp?`<div class="spark">${line(sp,30)}</div>`:''}</div>`;
function rank(o,n=8,label){const e=Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,n),m=Math.max(1,...e.map(x=>x[1]));return e.length?e.map(([k,v])=>`<div style="margin:10px 0"><div class="row"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label?label(k):k||'direct')}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/m*100}%"></i></div></div>`).join(''):'<div class="empty">Nothing yet</div>'}
const card=(t,body,meta)=>`<div class="card"><div class="ct">${t}${meta?`<span>${meta}</span>`:''}</div>${body}</div>`;
const sec=(t,up,lead)=>`<h2>${t}${up?`<span class="up">${up}</span>`:''}</h2>${lead?`<p class="lead">${lead}</p>`:''}`;
const srcName=k=>({direct:'Direct / typed in',yt:'YouTube',fb:'Facebook',ig:'Instagram',pin:'Pinterest',google:'Google search'}[k]||k);
const NAMES={youtube:'YouTube',facebook:'Facebook',instagram:'Instagram',pinterest:'Pinterest'},COL={youtube:'#ff0000',facebook:'#1877f2',instagram:'#d6249f',pinterest:'#e60023'};
let D={},S=null,SAT=null,BIZ=[],cur=location.hash.slice(1)||'all';

function overview(){const s=S||{},y=D.youtube||{},t=(D.posting||{}).today||{};
 const n=(l,v,sub)=>`<div class="n"><div class="l">${l}</div><div class="v">${fmt(v)}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
 const pd=Object.values(t).reduce((a,v)=>a+(v.done||0),0),pp=Object.values(t).reduce((a,v)=>a+(v.planned||0),0),uv=Object.values(t).filter(v=>!v.verified).reduce((a,v)=>a+v.planned,0);
 let h=`<div class="card biz"><div class="ct">Riside <span>website ${SAT?'read from database '+ago(SAT):'not loaded'} · YouTube checked ${ago((D.youtube||{}).checked_at||(D.youtube||{}).stale_from||D.generated_at)}</span></div><div class="nums">
  ${n('Real visitors today',s.real_visitors_1d,fmt(s.real_visitors_7d)+' this week')}${n('Real page views, 7 days',s.real_views_7d,fmt(s.real_views_total)+' all time')}${n('Real signups',s.signups_total,(s.test_signups_excluded||0)+' test signups hidden')}${n('Real paid members',s.paid_members,(s.test_members_excluded||0)+' test member hidden')}
  ${n('Member messages',s.messages_total,fmt(s.messages_unanswered)+' unanswered')}${n('YouTube views',y.total_views,(y.videos||0)+' Shorts')}${n('Posts today',pp?pd+'/'+pp:null,uv?uv+' not verifiable yet':'all verified')}</div></div>
  <div class="card biz"><div class="ct">Roofing <span>read from database ${ago(SAT)}</span></div><div class="nums">${n('Leads',s.roofing_total,fmt(s.roofing_7d)+' this week')}${n('Real visitors, 7 days',s.roofing_real_visitors_7d)}${(((BIZ.find(q=>q.slug==='roofing')||{}).data||{}).headline||[]).filter(q=>!/^(Leads|Page visits)/.test(q.label)).map(q=>n(esc(q.label),q.value,esc(q.sub||''))).join('')}</div></div>`;
 BIZ.filter(b=>b.slug!=='roofing').forEach(b=>{const x=b.data||{},all=[...(x.headline||[]),...(x.sections||[]).flatMap(q=>q.tiles||[])];
  h+=`<div class="card biz"><div class="ct">${esc(b.name)} <span>${x.updated?'updated '+ago(x.updated):'waiting for data'}</span></div>${all.length?'<div class="nums">'+all.map(q=>n(esc(q.label),q.value,esc(q.sub||''))).join('')+'</div>':'<div class="empty">No numbers yet</div>'}</div>`});
 const ck=D.checks||[];h+=card('Data checks',ck.map(c=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span><span class="pill ${c.ok?'ok':'warn'}">${c.ok?'OK':'Check'}</span> <b style="font-weight:500">${esc(c.name)}</b></span><span class="sub" style="text-align:right">${esc(c.detail)}</span></div>`).join('')||'<div class="empty">No checks yet</div>','last run '+ago(D.checked_at));
 return h}

function riside(){const s=S||{},y=D.youtube||{},p=D.posting||{},up='Read from the database '+ago(SAT)+(SAT?' ('+clock(SAT)+')':''),yup='Views checked '+ago(y.checked_at||y.stale_from||D.generated_at)+(y.stale_from?' (YouTube did not answer the last check)':', refreshes hourly');
 if(!S)return '<div class="note">Website numbers could not be loaded from the database right now.</div>';
 const rv=series(s.real_by_day,30),sd=series(s.signups_by_day,30),f=s.funnel_30d||{};
 const hrs=[...Array(24)].map((_,i)=>(s.by_hour_et||{})[String(i).padStart(2,'0')]||0);
 const vis=(s.recent_visits||[]).map(v=>`<tr><td>${clock(v.t)}<div class="sub">${dayName(new Date(v.t).toLocaleDateString('en-CA',{timeZone:'America/New_York'}))}</div></td><td>${esc(v.place||'?')}<div class="sub">${esc(v.dev||'')}</div></td><td>${esc(srcName(v.src))}<div class="sub">${esc(v.land||'')}</div></td><td class="r">${v.pages} pg · ${v.secs}s<div class="sub">${v.scroll}% scrolled</div></td><td class="r">${v.rec&&v.sid?`<a class="watch" href="https://riside.com/?replay=${encodeURIComponent(v.sid)}#admin" target="_blank">▶ Watch</a>`:'<span class="sub">no recording</span>'}</td></tr>`).join('');
 const sgl=(s.recent_signups||[]).filter(x=>!x.roofing).map(x=>`<tr><td><b style="font-weight:600">${esc(x.first_name)}</b> <span class="sub">${esc(x.email_domain)}</span><div class="sub">${esc(x.slot)} · ${esc(srcName(x.source))}</div></td><td class="r m">${ago(x.created_at)}</td></tr>`).join('');
 const today=p.today||{};
 const et=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'});
 const tcards=Object.entries(today).map(([k,v])=>{const ok=v.verified&&v.done>=v.planned&&v.planned>0;const st=!v.verified?'<span class="pill warn">Not verifiable yet</span>':v.overdue?`<span class="pill bad">${v.overdue} missed</span>`:ok?'<span class="pill ok">All posted</span>':'<span class="pill">On track</span>';
  const lines=v.items.map(x=>`<div class="${x.done?'ok':x.done===false&&x.due?'no':''}">${x.done?'✓':x.done===false&&x.due?'✕':x.done===null?'?':'○'} <b>${et(x.when)}</b> ${esc(x.title)}</div>`).join('');
  const nx=v.next?`<div class="nx" style="margin-top:8px">Next: ${et(v.next.when)} ET · ${esc(v.next.title)}</div>`:'<div style="margin-top:8px">Nothing else scheduled today</div>';
  return `<div class="card tip" tabindex="0"><div class="lab"><span class="dot" style="background:${COL[k]}"></span>${NAMES[k]||k}</div><div class="val">${v.done}/${v.planned}</div><div class="sub">posted today ${st}</div><div class="pop">${lines||'Nothing planned'}${nx}</div></div>`}).join('');
 const hist={};(p.history||[]).forEach(x=>{(hist[x.date]=hist[x.date]||[]).push(x)});
 const stp={live:'ok',missing:'bad',scheduled:'',unverified:'warn'},stl={live:'Live',missing:'Not found',scheduled:'Scheduled',unverified:'Not verifiable yet'};
 const histHtml=Object.keys(hist).sort().reverse().map(d=>`<tr><td colspan="2" style="padding-top:16px;border-top:0"><b style="font-weight:600">${dayName(d)}</b></td></tr>`+hist[d].map(x=>`<tr><td>${esc(x.title)}<div class="sub">${x.slot==='am'?'Morning':'Evening'} · ${esc(x.format||'')}</div></td><td class="r">${x.platforms.map(q=>`<div>${q.url?`<a href="${q.url}" target="_blank">${NAMES[q.p]}</a>`:NAMES[q.p]} <span class="pill ${stp[q.status]}">${stl[q.status]}${q.views!=null?' · '+fmt(q.views)+' views':''}</span></div>`).join('')}</td></tr>`).join('')).join('');
 const ytRows=(y.list||[]).map(v=>`<tr><td><a href="${v.url}" target="_blank">${esc(v.title)}</a></td><td class="m">${v.published?dayName(v.published.slice(0,10)):''}</td><td class="r">${fmt(v.views)}${v.exact?'':' <span class="pill" title="Rounded by YouTube">≈</span>'}</td></tr>`).join('');
 const so=D.social||{};
 return `
 ${sec('Website',up,s.real_rule?'Only real people. '+esc(s.real_rule)+'.':'')}
 <div class="g k">${kpi('Real visitors today',s.real_visitors_1d,'',rv.slice(-14))}${kpi('This week',s.real_visitors_7d,fmt(s.real_sessions_7d)+' visits')}${kpi('Last 30 days',s.real_visitors_30d,fmt(s.new_visitors_30d)+' new · '+fmt(s.returning_visitors_30d)+' returning')}${kpi('All time',s.real_visitors_total,'real people')}
 ${kpi('Avg time on site',s.avg_time_sec_30d!=null?s.avg_time_sec_30d+'s':null,'last 30 days')}${kpi('Avg scroll',s.avg_scroll_30d!=null?s.avg_scroll_30d+'%':null,'of the page')}${kpi('Real page views',s.real_views_7d,fmt(s.real_views_30d)+' in 30 days · '+fmt(s.real_views_total)+' all time')}${kpi('Pages per visit',s.avg_pages_30d)}${kpi('Bounce rate',s.bounce_pct_30d!=null?s.bounce_pct_30d+'%':null,'left after one page')}</div>
 <div class="g c2" style="margin-top:14px">${card('Real visitors per day',`<div class="chart">${line(rv,50)}</div>`,'last 30 days')}${card('When people visit',`<div class="chart">${bars(hrs,hrs.map((_,i)=>i+':00 ET'))}</div><div class="row sub"><span>12 am</span><span>12 pm</span><span>11 pm ET</span></div>`,'by hour, ET')}</div>
 <div class="sub" style="margin-top:10px">Filtered out this week: ${fmt(s.bot_views_7d)} of ${fmt(s.all_views_7d)} page views were bots, crawlers or testing.</div>

 ${sec('Where visitors come from',up)}
 <div class="g c3">${card('Source',rank(s.real_sources_30d,8,srcName),'30 days')}${card('Referring sites',rank(s.referrers_30d),'30 days')}${card('First page they landed on',rank(s.landing_pages_30d),'30 days')}${Object.keys(s.campaigns_30d||{}).length?card('Campaigns',rank(s.campaigns_30d),'30 days'):''}</div>

 ${sec('What they do',up)}
 <div class="g c3">${card('Pages viewed',rank(s.real_pages_30d,10),'30 days')}${card('What they clicked',rank(s.clicks_30d,10),'30 days')}
 ${card('Signup funnel',['visitors','engaged','opened_join','signed_up','paid'].map((k,i,a)=>{const v=f[k]||0,prev=i?f[a[i-1]]:0,m=Math.max(1,f.visitors||0);return `<div style="margin:10px 0"><div class="row"><span>${{visitors:'Real visitors',engaged:'Really engaged',opened_join:'Opened the join page',signed_up:'Signed up',paid:'Paid'}[k]}</span><b>${fmt(v)}${i&&prev?` <span class="sub">${Math.round(v/prev*100)}%</span>`:''}</b></div><div class="bar"><i style="width:${v/m*100}%"></i></div></div>`}).join(''),'30 days')}</div>

 ${sec('Who they are',up)}
 <div class="g c3">${card('Device',rank(s.devices_30d))}${card('Browser',rank(s.browsers_30d))}${card('System',rank(s.os_30d))}${card('Country',rank(s.countries_30d))}${card('City',rank(s.cities_30d,10))}</div>

 ${sec('Latest real visits',up,'Every visit from a real person, newest first. Press Watch to see exactly what they did (opens your admin login; typing is always hidden). Recording started Nov 10, so older visits have none.')}
 <div class="card">${vis?`<table><tr><th>When</th><th>Where</th><th>Came from</th><th class="r">Did</th><th class="r">Recording</th></tr>${vis}</table>`:'<div class="empty">No real visits yet</div>'}<div style="margin-top:12px">${fmt(s.recordings_7d||0)} recorded this week · <a href="https://riside.com/?replay=all#admin" target="_blank">All recordings in admin →</a></div></div>

 ${sec('Signups and members',up,'Test accounts (you, the admin login and funnel tests) are hidden from every number.')}
 <div class="g k">${kpi('Real signups',s.signups_total,(s.test_signups_excluded||0)+' test signups hidden',sd.slice(-14))}${kpi('This week',s.signups_7d,fmt(s.signups_1d)+' today')}${kpi('Real paid members',s.paid_members,(s.test_members_excluded||0)+' test member hidden')}${kpi('Member messages',s.messages_total,fmt(s.messages_7d)+' this week')}${kpi('Unanswered',s.messages_unanswered,'message threads waiting')}</div>
 <div class="g c3" style="margin-top:14px">${card('Real signups',sgl?`<table>${sgl}</table>`:'<div class="empty">No real signups yet</div>')}${card('Signups by source',rank(s.signups_by_source,8,srcName))}${card('Class time picked',rank(s.signups_by_slot))}</div>

 ${sec('Posting',`Checked ${ago(D.generated_at)} against what is actually live`,'Hover a card to see each post and the next one scheduled. Only YouTube can be checked automatically right now.')}
 <div class="g k">${tcards||'<div class="empty">Nothing planned today</div>'}</div>
 <div class="card" style="margin-top:14px"><div class="ct">Where everything was posted <span>last 7 days</span></div>${histHtml?`<table>${histHtml}</table>`:'<div class="empty">No posting plan found</div>'}</div>

 ${sec('YouTube',yup)}
 <div class="g k">${kpi('Total views',y.total_views,(y.videos||0)+' Shorts on the channel')}${kpi('Exact counts',y.exact_videos,'others rounded by YouTube')}${kpi('Best Short',(y.top||[])[0]?.views,esc(((y.top||[])[0]||{}).title||''))}</div>
 <div class="card" style="margin-top:14px"><div class="ct">Every Short <span>newest first</span></div>${ytRows?`<table><tr><th>Title</th><th>Posted</th><th class="r">Views</th></tr>${ytRows}</table>`:'<div class="empty">Not loaded</div>'}</div>

 ${sec('Facebook, Instagram, Pinterest',so.updated?'Synced '+ago(so.updated):'Not connected yet')}
 <div class="note">These platforms need a login on your PC to read numbers. Nothing is shown until a sync has actually read them, so no guessed numbers appear here.</div>`}

function bizHtml(b){const x=b.data||{},stale=x.updated&&(Date.now()-new Date(x.updated))>432e5;
 const tiles=a=>(a||[]).length?'<div class="g k">'+a.map(t=>kpi(esc(t.label),t.value,esc(t.sub||''),t.trend)).join('')+'</div>':'';
 let h=sec(esc(b.name),x.updated?'Updated '+ago(x.updated)+(stale?' · older than 12 h':''):'No data yet');
 if(x.notes)h+=`<div class="note">${esc(x.notes)}</div>`;
 h+=tiles(x.headline);
 (x.sections||[]).forEach(q=>{h+=sec(esc(q.title))+tiles(q.tiles);
  if((q.series||[]).length)h+='<div class="g c2" style="margin-top:14px">'+q.series.map(z=>card(esc(z.title),`<div class="chart">${line(series(z.data,z.days||30),50)}</div>`)).join('')+'</div>';
  if((q.funnel||[]).length){const m=Math.max(1,...q.funnel.map(f=>f.value));h+='<div class="card" style="margin-top:14px">'+q.funnel.map((f,i)=>`<div style="margin:10px 0"><div class="row"><span>${esc(f.label)}</span><b>${fmt(f.value)}${i&&q.funnel[i-1].value?' <span class="sub">'+Math.round(f.value/q.funnel[i-1].value*100)+'%</span>':''}</b></div><div class="bar"><i style="width:${f.value/m*100}%"></i></div></div>`).join('')+'</div>'}
  if((q.tables||[]).length)h+='<div class="g c2" style="margin-top:14px">'+q.tables.map(t=>card(esc(t.title),`<table>${t.rows.map(r=>'<tr>'+r.map((c,i)=>`<td class="${i==r.length-1&&r.length>1?'r':''}">${esc(c)}</td>`).join('')+'</tr>').join('')}</table>`)).join('')+'</div>'});
 return h}

function render(){const tabs=[['all','Overview'],['riside','Riside'],...BIZ.map(b=>['b_'+b.slug,b.name])];
 if(!tabs.some(t=>t[0]===cur))cur='all';
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" class="${k===cur?'on':''}">${esc(l)}</button>`).join('');
 $('#fresh').innerHTML=`Website ${SAT?'read from database '+ago(SAT):'not loaded'} · YouTube and posting checked ${ago(D.generated_at)} · refreshes automatically`;
 const b=BIZ.find(x=>'b_'+x.slug===cur);
 $('#app').innerHTML=cur==='all'?sec('Everything','Hard numbers across every business')+overview():cur==='riside'?riside():b?bizHtml(b):''}
$('#nav').onclick=e=>{const t=e.target.dataset&&e.target.dataset.t;if(t){cur=t;location.hash=t;render();scrollTo(0,0)}};
async function load(){
 const [d,biz]=await Promise.all([fetch('data.json?'+Date.now()).then(r=>r.json()).catch(()=>({})),fetch('biz/index.json?'+Date.now()).then(r=>r.json()).catch(()=>[])]);
 D=d;BIZ=await Promise.all(biz.map(b=>fetch('biz/'+b.slug+'.json?'+Date.now()).then(r=>r.json()).then(x=>({...b,data:x})).catch(()=>b)));
 try{const r=await fetch(SB,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:'{}'});if(r.ok){S=await r.json();SAT=S.generated_at||new Date().toISOString()}}catch(e){}
 if(!S&&D.site){S=D.site;SAT=D.generated_at}
 render()}
addEventListener('hashchange',()=>{cur=location.hash.slice(1)||'all';render()});
load();setInterval(load,120000);setInterval(()=>{$('#fresh').innerHTML=`Website ${SAT?'read from database '+ago(SAT):'not loaded'} · YouTube and posting checked ${ago(D.generated_at)} · refreshes automatically`},30000);
</script></body></html>

name: Refresh class events
on:
  schedule: [{cron: '17 6 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, sparse-checkout: "/index.html\n/scripts/", sparse-checkout-cone-mode: false}
      - run: python3 scripts/refresh_events.py
      - name: Commit
        run: |
          git config user.name dash-bot; git config user.email dash-bot@users.noreply.github.com
          git add index.html && (git diff --cached --quiet || (git commit -m "Refresh class events" && git pull --rebase origin main && git push)) || true

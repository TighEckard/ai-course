name: Signup alerts
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/signup_alert.py, .github/workflows/signup-alert.yml]
permissions:
  contents: write
  issues: write
concurrency: {group: signup-alert, cancel-in-progress: false}
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, sparse-checkout: "dash\nscripts", sparse-checkout-cone-mode: false}
      - run: python3 scripts/signup_alert.py
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Save state
        run: |
          git config user.name dash-bot; git config user.email dash-bot@users.noreply.github.com
          git add dash/feed/alert_state.json && (git diff --cached --quiet || (git commit -m "Alert state" && git pull --rebase origin main && git push)) || true

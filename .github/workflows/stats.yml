name: Refresh stats
on:
  schedule: [{cron: '17 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch aggregate stats
        run: |
          curl -fsS -X POST "https://yhsxxblilclylzgejehk.supabase.co/rest/v1/rpc/public_stats" \
            -H "apikey: sb_publishable_9BiONVmj8Ht4k7lBsxGkkA_Yajbl8Rj" -H "Content-Type: application/json" -d '{}' \
            | python3 -m json.tool > stats/stats.json || echo "public_stats() not installed yet; run stats-setup.sql"
      - name: Commit
        run: |
          git config user.name stats-bot; git config user.email stats-bot@users.noreply.github.com
          git add stats/stats.json && (git diff --cached --quiet || git commit -m "Refresh stats" && git push) || true

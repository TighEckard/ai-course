name: Refresh dashboard
on:
  schedule: [{cron: '7 */3 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, sparse-checkout: "dash\nscripts\nposts.json", sparse-checkout-cone-mode: false}
      - run: python3 scripts/dash_build.py
      - name: Commit
        run: |
          git config user.name dash-bot; git config user.email dash-bot@users.noreply.github.com
          git add dash && (git diff --cached --quiet || (git commit -m "Refresh dashboard" && git pull --rebase origin main && git push)) || true

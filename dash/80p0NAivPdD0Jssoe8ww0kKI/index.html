<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Morning dashboard</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1c2230;--mut:#6b7280;--navy:#16264a;--amber:#e8a317;--ok:#2f855a;--bad:#c53030;--line:#ece6da}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#181e2a;--ink:#eef0f4;--mut:#9aa3b2;--navy:#9db4ff;--line:#262e3d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;padding:16px;max-width:980px;margin:auto}
h1{font:600 22px Georgia,serif;margin:4px 0}h2{font:600 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:24px 0 8px}
.sub{color:var(--mut);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.big{font:600 28px Georgia,serif;color:var(--navy)}.lab{font-size:12px;color:var(--mut)}.d{font-size:12px}.up{color:var(--ok)}.dn{color:var(--bad)}
.wide{grid-column:1/-1}svg{width:100%;height:70px;display:block}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.warn{background:#fff6e0;color:#7a5200;border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}a{color:var(--navy)}
</style></head><body>
<h1>Morning dashboard</h1><div class="sub" id="upd">Loading…</div><div id="app"></div>
<script>
const $=s=>document.getElementById(s),fmt=n=>n==null?'–':Number(n).toLocaleString();
const tile=(l,v,s)=>`<div class="card"><div class="lab">${l}</div><div class="big">${fmt(v)}</div><div class="d lab">${s||''}</div></div>`;
function bars(obj,days=30){const k=[];for(let i=days-1;i>=0;i--){k.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10))}
 const v=k.map(x=>obj[x]||0),m=Math.max(1,...v),w=100/k.length;
 return `<svg viewBox="0 0 100 40" preserveAspectRatio="none">${v.map((n,i)=>`<rect x="${i*w+.3}" width="${w-.6}" y="${40-n/m*38}" height="${n/m*38}" fill="#e8a317"><title>${k[i]}: ${n}</title></rect>`).join('')}</svg>`}
const list=o=>'<table>'+Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`<tr><td>${k}</td><td>${fmt(v)}</td></tr>`).join('')+'</table>';
const ago=t=>{const h=(Date.now()-new Date(t))/36e5;return h<1?'just now':h<48?Math.round(h)+'h ago':Math.round(h/24)+'d ago'};
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
 $('upd').textContent='Updated '+ago(d.generated_at)+' (refreshes every 3 hours)';
 let h='';const s=d.site,y=d.youtube,p=d.posting,so=d.social||{};
 Object.values(d.errors||{}).forEach(e=>h+=`<div class="warn">⚠ ${e}</div>`);
 h+='<h2>Today at a glance</h2><div class="grid">';
 if(s){h+=tile('Signups, last 24h',s.signups_1d,fmt(s.signups_total)+' total')+tile('Paid members',s.paid_members)+tile('Page views, 24h',s.views_1d,fmt(s.views_7d)+' in 7 days')+tile('Roofing leads',s.roofing_total,fmt(s.roofing_7d)+' this week')}
 if(y)h+=tile('YouTube views',y.total_views,y.videos+' recent Shorts');
 h+='</div>';
 if(s){h+='<h2>riside.com traffic and signups (30 days)</h2><div class="grid"><div class="card wide"><div class="lab">Page views per day</div>'+bars(s.views_by_day)+'</div><div class="card wide"><div class="lab">Signups per day</div>'+bars(s.signups_by_day)+'</div>'+
  `<div class="card"><div class="lab">Traffic sources</div>${list(s.views_by_source_30d)}</div><div class="card"><div class="lab">Signups by source</div>${list(s.signups_by_source)}</div><div class="card"><div class="lab">Top pages</div>${list(s.top_pages_30d)}</div></div>`}
 if(y)h+='<h2>YouTube</h2><div class="card"><table>'+y.top.map(v=>`<tr><td><a href="${v.url}">${v.title}</a></td><td>${fmt(v.views)}</td></tr>`).join('')+'</table></div>';
 h+='<h2>Facebook, Instagram, Pinterest</h2><div class="grid">';
 const sl=[['Facebook',so.facebook],['Instagram',so.instagram],['Pinterest',so.pinterest]];
 sl.forEach(([n,o])=>{o=o||{};const e=Object.entries(o);h+=`<div class="card"><div class="lab">${n}</div>${e.length?e.map(([k,v])=>`<div>${k.replace(/_/g,' ')}: <b>${fmt(v)}</b></div>`).join(''):'<div class="lab">No data yet</div>'}</div>`});
 h+='</div>';
 if(p){h+='<h2>Posting</h2><div class="card"><table>'+Object.entries(p.last).map(([k,v])=>`<tr><td>${k}: ${v.label}</td><td>${ago(v.t)}</td></tr>`).join('')+'</table><div class="lab" style="margin-top:6px">Posts in last 7 days: '+Object.entries(p.posts_7d).map(([k,v])=>k+' '+v).join(', ')+'</div></div>'}
 $('app').innerHTML=h;
}).catch(e=>{$('upd').textContent='No data yet. First refresh is pending.'});
</script></body></html>

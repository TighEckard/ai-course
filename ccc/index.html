<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Crochet Club</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#c0566b">
<style>
:root{--bg:#fbf6f0;--card:#fff;--ink:#3b2f2f;--mute:#8a7a72;--acc:#c0566b;--line:#eadfd6}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:14px;max-width:720px;margin:auto}
h1{font-size:20px;margin:4px 0}h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:22px 0 8px}
.sub{color:var(--mute);font-size:12px}.warn{background:#fff1d6;border:1px solid #f0d28a;border-radius:10px;padding:8px 10px;font-size:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.t b{display:block;font-size:22px}.t span{font-size:12px;color:var(--mute)}.t i{font-style:normal;font-size:11px;color:var(--mute);display:block}
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border:0}
.fb{height:14px;background:var(--acc);border-radius:7px;margin:2px 0 6px}
.rep{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px;margin-top:8px;font-size:13px}
svg{width:100%;height:60px}
</style></head><body>
<h1>🧶 Cozy Crochet Club</h1><div class="sub" id="upd"></div><div id="warn"></div>
<div id="app"></div>
<script>
const e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('../tigh/biz/cozy.json?'+Date.now()).then(r=>r.json()).then(d=>{
 const n=d.updated?new Date(d.updated):null;
 document.getElementById('upd').textContent='Updated '+(n?n.toLocaleString():'unknown')+(n&&Date.now()-n>30*36e5?' (stale)':'');
 if(d.notes)document.getElementById('warn').innerHTML='<div class="warn">'+e(d.notes)+'</div>';
 const tile=t=>'<div class="t"><span>'+e(t.label)+'</span><b>'+e(typeof t.value==='number'?t.value.toLocaleString():t.value)+'</b><i>'+e(t.sub||'')+'</i></div>';
 let h='';
 if((d.replies||[]).length){h+='<h2>Recent creator replies</h2>'+d.replies.map(r=>'<div class="rep"><b>'+e(r.name)+'</b> <span class="sub">'+e(r.followers||'')+' '+e(r.when||'')+'</span><br>'+e(r.text)+'</div>').join('')}
 h+='<h2>Overview</h2><div class="grid">'+(d.headline||[]).map(tile).join('')+'</div>';
 (d.sections||[]).forEach(s=>{
  h+='<h2>'+e(s.title)+'</h2>';
  if(s.tiles)h+='<div class="grid">'+s.tiles.map(tile).join('')+'</div>';
  if(s.funnel){const m=Math.max(...s.funnel.map(f=>f.value));h+='<div class="bar">'+s.funnel.map(f=>'<div class="row"><span>'+e(f.label)+'</span><b>'+f.value.toLocaleString()+'</b></div><div class="fb" style="width:'+Math.max(2,f.value/m*100)+'%"></div>').join('')+'</div>'}
  (s.series||[]).forEach(x=>{const k=Object.keys(x.data).sort().slice(-(x.days||30)),v=k.map(i=>x.data[i]),m=Math.max(1,...v);
   h+='<div class="bar"><div class="sub">'+e(x.title)+'</div><svg viewBox="0 0 '+v.length*10+' 60" preserveAspectRatio="none">'+v.map((y,i)=>'<rect x="'+(i*10+1)+'" y="'+(60-y/m*58)+'" width="8" height="'+(y/m*58)+'" fill="#c0566b" rx="1"/>').join('')+'</svg></div>'});
  (s.tables||[]).forEach(t=>{h+='<div class="bar"><div class="sub">'+e(t.title)+'</div>'+t.rows.map(r=>'<div class="row"><span>'+e(r[0])+'</span><span>'+e(r[1])+'</span></div>').join('')+'</div>'});
 });
 document.getElementById('app').innerHTML=h;
}).catch(()=>{document.getElementById('app').textContent='Could not load data.'});
</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js",{scope:"/ccc/"}).catch(()=>{})</script></body></html>
